# Which clients and competitors to track.
# Use codenames for clients, since this repo is public.
#
# You can edit this from the dashboard (Settings) or by hand. It's written in
# JSON style, which is valid YAML, so the dashboard can read and save it.
# Keep full-line comments only, at the top.
#
# Optional settings per client:
#   keywords:  topics the client cares about. Pages added, removed or changed
#              with one of them in the URL, title or H1 become keyword alerts.
#   exclude:   paths to ignore on every competitor ('/careers' covers everything
#              under it; '*' is a wildcard, e.g. '*/jobs/*').
# Optional settings per competitor:
#   exclude:      paths to ignore on that site only.
#   asset_types:  what a folder holds when the URL doesn't say, e.g. {"/a": "blog"}.
#                 Types: webinar, whitepaper, case_study, podcast, video, event,
#                 news, blog, resource, docs, careers, legal, product, category, other.
#   sitemaps:     sitemap URLs to use instead of discovering them.
{
  "clients": [
    {
      "id": "client-a",
      "name": "Client A",
      "keywords": [
        "running",
        "basketball",
        "pickleball",
        "jordan",
        "trail"
      ],
      "exclude": [
        "/careers",
        "/privacy",
        "/terms"
      ],
      "competitors": [
        {
          "name": "Nike",
          "domain": "www.nike.com/il",
          "exclude": [
            "/retail",
            "/size-fit"
          ],
          "asset_types": {
            "/a": "blog",
            "/t": "product",
            "/w": "category",
            "/launch": "product"
          }
        },
        {
          "name": "New Balance",
          "domain": "www.newbalance.co.il/en"
        },
        {
          "name": "Asics",
          "domain": "www.asics.com/us/en-us"
        },
        {
          "name": "Reebok",
          "domain": "www.reebok.com"
        },
        {
          "name": "Skechers",
          "domain": "www.skechers.com"
        }
      ]
    }
  ]
}
